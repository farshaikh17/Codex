name: Career pipeline (discovery, qualification, private dashboards)
# Runs on the default branch only (GitHub schedules and manual dispatch use the workflow file on main), so nothing
# runs from engine-v2/career-matching until it is merged. Free: GitHub-hosted runner minutes only, no paid services.
# Private inputs come from repository secrets; state and results are encrypted with PIPELINE_PASSPHRASE.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'   # daily 03:23 UTC (08:53 IST), after the 01:37 UTC collection
permissions:
  contents: read
concurrency:
  group: career-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pipeline regression tests (offline)
        run: python -m unittest -v engine.tests.test_pipeline engine.tests.test_match
      - name: Restore encrypted tracker state
        uses: actions/cache/restore@v4
        with:
          path: state-cache
          key: career-state-${{ github.run_id }}
          restore-keys: career-state-
      - name: Discover, qualify, export (private, encrypted)
        env:
          CANDIDATES_B64: ${{ secrets.CANDIDATES_B64 }}
          PIPELINE_PASSPHRASE: ${{ secrets.PIPELINE_PASSPHRASE }}
          STATE_DIR: ${{ github.workspace }}/state-cache
          WORK_DIR: ${{ runner.temp }}/career
        run: bash engine/ci/run_pipeline.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save encrypted tracker state
        if: hashFiles('state-cache/state.sqlite.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state-cache
          key: career-state-${{ github.run_id }}
      - name: Upload encrypted dashboards and CSVs
        if: hashFiles('state-cache/state.sqlite.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: career-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/career/results.tar.gz.enc
            state-cache/state.sqlite.enc
          retention-days: 30
