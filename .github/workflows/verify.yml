name: Verify
# Read-only, no secrets. Runs on pull requests into main and on demand: builds the frontend, bundles the Worker
# (dry run, nothing is deployed) and runs the unit, bundle-privacy and migration tests. ~2 minutes per run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run verify
