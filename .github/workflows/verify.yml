name: Verify (manual)
# Manual only, read-only, no secrets: builds the frontend, bundles the Worker (dry run, nothing is deployed) and runs the tests.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run verify
