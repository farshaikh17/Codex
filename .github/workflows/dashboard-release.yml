name: Dashboard release to production (manual)
# The ONLY path that changes the career-job-engine Worker. Manual, from main, one run at a time, and it re-runs every
# check itself. Never triggered by a push, a schedule or another workflow (so it cannot create a second schedule).
# The public dashboard needs NO operator key to deploy or verify: only the Cloudflare secrets below.
#
#   mode = preflight (default)  read-only: account, database id, token permissions, rollback points. Changes nothing.
#   mode = verify              read-only: public smoke test, real-browser check and the protected-record fingerprint of the live system.
#   mode = diagnose            read-only incident check: D1 info and 24h usage (when the token can read it), one SELECT 1, and
#                              the Worker's own error for one public request (wrangler tail, filtered). No fingerprint, no tests
#                              against production beyond that single request.
#   mode = release              preflight, fingerprint, migrations 0008-0010 (additive), the owner-approved score correction (idempotent, capped writes), deploy, public smoke test, real-browser
#                               check (desktop + 375px mobile), fingerprint comparison.
#
# Secrets (repository secrets; the collector's sync workflow already uses the same two):
#   CLOUDFLARE_API_TOKEN   Account: Workers Scripts Edit, D1 Edit (nothing else). Never printed.
#   CLOUDFLARE_ACCOUNT_ID  must equal account_id in dashboard/wrangler.toml, or the run stops before any change.
# ADMIN_API_KEY stays a Cloudflare Worker secret (it is not read here). Rotating it: tick rotate_key and add the
# NEW_ADMIN_API_KEY repository secret first; it is written to Cloudflare and never used by the verification steps.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight = read-only checks (default). release = change production. verify = re-run the post-deploy checks and print the protected-record fingerprint; changes nothing.'
        required: true
        type: choice
        options: [preflight, release, verify, diagnose]
        default: preflight
      confirm_sha:
        description: 'Full commit SHA of main you intend to release (must equal the commit this run uses)'
        required: true
        type: string
      rotate_key:
        description: 'Replace the Worker secret ADMIN_API_KEY with the NEW_ADMIN_API_KEY repository secret'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: dashboard
concurrency:
  group: dashboard-production-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Guard - owner, main only, exact commit
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          CONFIRM: ${{ inputs.confirm_sha }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        working-directory: .   # runs before checkout, when ./dashboard does not exist yet
        run: |
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::Only the repository owner may run releases"; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Releases run from main only (this run is on $REF)"; exit 1; }
          [ "$CONFIRM" = "$SHA" ] || { echo "::error::confirm_sha does not match the commit being released ($SHA)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODE: ${{ inputs.mode }}
      ROTATE: ${{ inputs.rotate_key }}
      SMOKE_BASE: https://career-job-engine.farshaikh17.workers.dev
    steps:
      - name: Guard again, in the job that holds the secrets
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          CONFIRM: ${{ inputs.confirm_sha }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        working-directory: .   # runs before checkout, when ./dashboard does not exist yet
        run: |
          [ "$ACTOR" = "$OWNER" ] && [ "$REF" = "refs/heads/main" ] && [ "$CONFIRM" = "$SHA" ] || { echo "::error::Not the owner, not main, or confirm_sha mismatch"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: Diagnose (read-only; mode=diagnose only)
        if: ${{ inputs.mode == 'diagnose' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e   # report every probe even when one fails; this step changes nothing
          EXPECTED=$(grep -E '^account_id' wrangler.toml | sed -E 's/.*"([0-9a-f]+)".*/\1/')
          [ "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not the account in dashboard/wrangler.toml"; exit 1; }
          {
            echo "### Diagnose (read-only)"
            echo "- live version: $(curl -sS -m 15 "$SMOKE_BASE/api/version" || echo unreachable)"
            echo '#### wrangler d1 info (24h usage fields appear only if the token may read account analytics)'
            npx wrangler d1 info career-job-engine --json 2>&1 | grep -v -i 'token' | tail -n 40
            echo '#### One minimal remote query: SELECT 1'
            npx wrangler d1 execute career-job-engine --remote --command "SELECT 1 AS ok" --json 2>&1 | tail -n 40
            echo '#### Dashboard read meter, last 3 UTC days (rows read by cache misses; table from migration 0009)'
            npx wrangler d1 execute career-job-engine --remote --command "SELECT day, rows_read, public_misses, operator_misses, cache_writes FROM read_meter ORDER BY day DESC LIMIT 3" --json 2>&1 | grep -E '"(day|rows_read|public_misses|operator_misses|cache_writes)"|error|ERROR' | head -n 20
            echo '#### Account usage per UTC day from Cloudflare analytics (all clients; this, not the meter, is what the free limits apply to)'
            node scripts/d1_usage.mjs 3 2>&1 | head -n 12
            echo '#### Rows read by query (wrangler d1 insights: every client of the database, Worker, cron and collector alike; SQL text only)'
            for PERIOD in 1h 1d; do
              echo "--- last $PERIOD, top queries by rows read"
              npx wrangler d1 insights career-job-engine --time-period "$PERIOD" --sort-type sum --sort-by reads --limit 12 --json 2>/dev/null | node -e "
                let t='';process.stdin.on('data',d=>t+=d).on('end',()=>{try{const a=JSON.parse(t.slice(t.indexOf('[')));let tot=0;for(const q of a){const o={};for(const [k,v] of Object.entries(q)){if(/^(query|sql)$/i.test(k))o.query=String(v).replace(/\\s+/g,' ').slice(0,110);else if(/row|time|count|times|run/i.test(k)&&typeof v==='number')o[k]=Math.round(v*100)/100;}console.log(JSON.stringify(o));}}catch(e){console.log('insights unavailable: '+String(e.message).slice(0,120)+' '+t.slice(0,160).replace(/token/ig,'***'));}})"
            done
            echo '--- last 1d, top queries by rows WRITTEN (all clients)'
            npx wrangler d1 insights career-job-engine --time-period 1d --sort-type sum --sort-by writes --limit 8 --json 2>/dev/null | node -e "let t='';process.stdin.on('data',d=>t+=d).on('end',()=>{try{for(const q of JSON.parse(t.slice(t.indexOf('[')))){console.log(JSON.stringify({query:String(q.query||q.sql||'').replace(/\\s+/g,' ').slice(0,100),totalRowsWritten:q.totalRowsWritten,numberOfTimesRun:q.numberOfTimesRun}));}}catch(e){console.log('insights unavailable: '+String(e.message).slice(0,100));}})"
            echo '#### Pending score correction (dry run: counts only)'
            node --import ./test/register.mjs scripts/rescore_ranking_v2.mjs --remote 2>&1 | grep -v -i 'warning\|trace-warnings\|Reparsing\|eliminate this' | head -n 20
            echo '#### Table row counts and job inventory (read-only)'
            # One row of scalar subqueries: D1 allows at most 5 terms in a compound SELECT (UNION ALL), which is why the earlier query failed.
            npx wrangler d1 execute career-job-engine --remote --command "SELECT (SELECT COUNT(*) FROM jobs) jobs, (SELECT COUNT(*) FROM jobs WHERE is_active=1) jobs_active, (SELECT COUNT(*) FROM candidate_qualifications) qualifications, (SELECT COUNT(*) FROM candidate_job_scores) scores, (SELECT COUNT(*) FROM applications) applications, (SELECT COUNT(*) FROM application_history) application_history, (SELECT COUNT(*) FROM cloud_discovery_runs) discovery_runs, (SELECT COUNT(*) FROM response_cache) cache_entries, (SELECT COUNT(*) FROM auth_failures) auth_failures" --json 2>&1 | node -e "let t='';process.stdin.on('data',d=>t+=d).on('end',()=>{try{console.log(JSON.stringify(JSON.parse(t.slice(t.indexOf('[')))[0].results[0]))}catch(e){console.log('table counts FAILED: '+t.slice(0,300).replace(/token/ig,'***'))}})"
            npx wrangler d1 execute career-job-engine --remote --command "SELECT COALESCE(source_adapter,'(none)') src, COALESCE(provenance,'(none)') prov, is_active act, COUNT(*) n FROM jobs GROUP BY 1,2,3 ORDER BY n DESC LIMIT 30" --json 2>&1 | grep -E '"(src|prov|act|n)"' | paste - - - - | head -30
            npx wrangler d1 execute career-job-engine --remote --command "SELECT substr(discovered_at,1,10) day, COUNT(*) n FROM jobs GROUP BY 1 ORDER BY 1 DESC LIMIT 14" --json 2>&1 | grep -E '"(day|n)"' | paste - - | head -14
            echo '#### Discovery queue and run health (read-only)'
            echo '--- collector imports still waiting for assessment, per candidate (partial index; empty once the backlog is done)'
            npx wrangler d1 execute career-job-engine --remote --command "SELECT candidate_id, COUNT(*) n FROM candidate_qualifications WHERE qualification_reason LIKE '[GITHUB_COLLECTOR] Unassessed%' GROUP BY candidate_id" --json 2>&1 | grep -E '"(candidate_id|n)"|rror' | paste - - | head -5
            npx wrangler d1 execute career-job-engine --remote --command "SELECT state, COUNT(*) n FROM cloud_discovery_queue GROUP BY state" --json 2>&1 | grep -E '"(state|n)"|rror' | paste - - | head -10
            npx wrangler d1 execute career-job-engine --remote --command "SELECT status, run_type, COUNT(*) n FROM cloud_discovery_runs WHERE started_at >= strftime('%Y-%m-%dT%H:%M:%SZ','now','-1 day') GROUP BY 1,2 ORDER BY n DESC" --json 2>&1 | grep -E '"(status|run_type|n)"|rror' | paste - - - | head -10
            echo '--- sources whose last attempt failed (id, status, failures, error)'
            npx wrangler d1 execute career-job-engine --remote --command "SELECT id, last_status, failures, substr(last_error,1,120) err FROM cloud_sources WHERE last_status='ERROR' OR failures>0 ORDER BY failures DESC LIMIT 10" --json 2>&1 | grep -E '"(id|last_status|failures|err)"|rror' | paste - - - - | head -10
            echo '--- queue items with an error (source, posting id, state, attempts, error, title and application URL host/path from the stored payload)'
            npx wrangler d1 execute career-job-engine --remote --command "SELECT source_id, posting_id, state, attempts, substr(last_error,1,140) err, substr(COALESCE(json_extract(payload,'\$.title'),json_extract(payload,'\$.text'),json_extract(payload,'\$.name')),1,70) title, substr(COALESCE(json_extract(payload,'\$.absolute_url'),json_extract(payload,'\$.hostedUrl'),json_extract(payload,'\$.applyUrl'),json_extract(payload,'\$.ref'),json_extract(payload,'\$.url')),1,110) url FROM cloud_discovery_queue WHERE last_error IS NOT NULL OR state='FAILED' ORDER BY updated_at DESC LIMIT 15" --json 2>&1 | grep -E '"(source_id|posting_id|state|attempts|err|title|url)"|rror' | paste - - - - - - - | head -15
          } 2>&1 | tee diag.txt
          # The Worker's own error for two requests to /api/health (reads at most one row). Only outcome, exception text and
          # console lines are kept: no request headers, no query strings, no response bodies.
          timeout 80 npx wrangler tail career-job-engine --format json > tail.jsonl 2> tail.err &
          TAIL=$!
          sleep 25
          for i in 1 2; do curl -sS -m 20 -o /dev/null -w 'public /api/health -> HTTP %{http_code}\n' "$SMOKE_BASE/api/health" | tee -a diag.txt; sleep 5; done
          sleep 15
          kill $TAIL 2>/dev/null; wait $TAIL 2>/dev/null || true
          {
            echo '#### Worker events during the window (filtered)'
            node -e "
            const lines=require('fs').readFileSync('tail.jsonl','utf8').split(/\n(?=\{)/).filter(Boolean);
            let n=0;for(const l of lines){let e;try{e=JSON.parse(l)}catch{continue}
              const path=e.event?.request?.url?new URL(e.event.request.url).pathname:(e.event?.cron?'cron '+e.event.cron:'?');
              console.log(JSON.stringify({outcome:e.outcome,path,exceptions:(e.exceptions||[]).map(x=>String(x.name)+': '+String(x.message).slice(0,400)),logs:(e.logs||[]).map(x=>(x.message||[]).map(String).join(' ').slice(0,400))}));n++;}
            if(!n)console.log('no events captured');"
            echo '--- tail stderr (last lines)'; tail -n 8 tail.err | grep -v -i 'token'
          } 2>&1 | tee -a diag.txt
          { echo '```'; cat diag.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "Diagnose finished: nothing in production was changed." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preflight - account, database, token permissions, rollback points (read-only)
        if: ${{ inputs.mode != 'diagnose' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "### Dashboard release ($MODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets are missing"; exit 1; }
          EXPECTED=$(grep -E '^account_id' wrangler.toml | sed -E 's/.*"([0-9a-f]+)".*/\1/')
          [ "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not the account in dashboard/wrangler.toml; stopping before any change"; exit 1; }
          echo "- account matches wrangler.toml: yes" >> "$GITHUB_STEP_SUMMARY"
          DB_ID=$(grep -E '^database_id' wrangler.toml | sed -E 's/.*"([0-9a-f-]+)".*/\1/')
          npx wrangler d1 info career-job-engine > d1info.txt
          grep -q "$DB_ID" d1info.txt || { echo "::error::The D1 database named career-job-engine in this account is not the one in wrangler.toml"; exit 1; }
          echo "- D1 database id matches wrangler.toml: yes" >> "$GITHUB_STEP_SUMMARY"
          if npx wrangler secret list --format json | node -e "const s=JSON.parse(require('fs').readFileSync(0,'utf8'));process.exit(s.some(x=>x.name==='ADMIN_API_KEY')?0:1)"; then
            echo "- Worker secret ADMIN_API_KEY present (value never read): yes. Protected actions work." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ROTATE" = "true" ]; then
            echo "- Worker secret ADMIN_API_KEY present: no (rotation will create it)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::ADMIN_API_KEY is not set on the Worker: public viewing works, but protected actions answer 503 until it is set (re-run with rotate_key)."
            echo "- Worker secret ADMIN_API_KEY present: **no** (public viewing is unaffected; protected actions are unavailable)" >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo '- current deployments (rollback target = newest entry before this release):'; echo '```'; npx wrangler deployments list | tail -n 12; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo '- D1 restore bookmark (Time Travel):'; echo '```'; npx wrangler d1 time-travel info career-job-engine; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo '- live version before this run:'; echo '```'; curl -fsS "$SMOKE_BASE/api/version" || echo '(unreachable)'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fingerprint protected records before
        if: ${{ inputs.mode != 'diagnose' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/fingerprint.mjs --remote > before.json && cat before.json

      - name: Preflight finished - nothing was changed
        if: ${{ inputs.mode == 'preflight' }}
        run: |
          echo "Preflight passed - token permissions, account, database and rollback records are in order. Run again with mode=release to deploy." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add the guess-limiter, read-cache and read-meter tables (additive, idempotent; migrations 0001-0007 are NOT replayed)
        if: ${{ inputs.mode == 'release' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute career-job-engine --remote --file=migrations/0008_auth_failures.sql
          npx wrangler d1 execute career-job-engine --remote --file=migrations/0009_response_cache.sql
          npx wrangler d1 execute career-job-engine --remote --file=migrations/0010_assessment.sql
          # Stop before deploying if the cache tables do not have the shape this Worker expects (reads no rows).
          npx wrangler d1 execute career-job-engine --remote --command "SELECT key, body, created_at, generation FROM response_cache LIMIT 0; SELECT day, rows_read, public_misses, operator_misses, cache_writes FROM read_meter LIMIT 0; SELECT generation FROM cache_state LIMIT 0" > /dev/null

      - name: Rotate operator key (only when requested)
        if: ${{ inputs.mode == 'release' && inputs.rotate_key }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEW_ADMIN_API_KEY: ${{ secrets.NEW_ADMIN_API_KEY }}
        run: |
          [ -n "$NEW_ADMIN_API_KEY" ] || { echo "::error::rotate_key is ticked but the NEW_ADMIN_API_KEY secret is empty"; exit 1; }
          printf '%s' "$NEW_ADMIN_API_KEY" | npx wrangler secret put ADMIN_API_KEY

      - name: Build the frontend (no Cloudflare credentials in this step)
        if: ${{ inputs.mode == 'release' }}
        run: npm run build:frontend

      - name: Deploy (records the commit in the Worker so the live version can be matched)
        if: ${{ inputs.mode == 'release' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --var "GIT_COMMIT:$GITHUB_SHA" --var "DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>&1 | tee deploy.log
          VERSION=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | awk '{print $4}' || true)
          echo "- deployed version id: \`${VERSION:-see log}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Requeue postings rejected only by the old application-URL rule (Greenhouse employer-hosted links; idempotent)
        if: ${{ inputs.mode == 'release' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The Worker now keeps these postings with their canonical Greenhouse link. Items that failed with the OLD generic message, on a
          # Greenhouse source, with a stored title are put back in the queue once; a posting that is genuinely invalid fails again, visibly.
          npx wrangler d1 execute career-job-engine --remote --command "UPDATE cloud_discovery_queue SET state='PENDING', attempts=0, last_error=NULL, next_due=0 WHERE source_id LIKE 'greenhouse:%' AND last_error='Posting missing title or official HTTPS application URL' AND COALESCE(json_extract(payload,'\$.title'),'')<>''" --json 2>&1 | grep -E 'changes|rows_written|rror' | head -5

      - name: Correct stored preliminary scores AFTER the deploy (owner-approved ranking change; dry run first, idempotent, refuses above 20,000 rows written)
        if: ${{ inputs.mode == 'release' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '#### Dry run (reads only)'; node --import ./test/register.mjs scripts/rescore_ranking_v2.mjs --remote 2>&1 | grep -v -i 'warning\|trace-warnings\|Reparsing\|eliminate this' | tee rescore.txt
          echo '#### Apply'; node --import ./test/register.mjs scripts/rescore_ranking_v2.mjs --remote --apply 2>&1 | grep -v -i 'warning\|trace-warnings\|Reparsing\|eliminate this' | tee -a rescore.txt
          { echo '### Score correction'; echo '```'; cat rescore.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Flush the read cache (a deploy never reuses an answer computed by the previous code)
        if: ${{ inputs.mode == 'release' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute career-job-engine --remote --command "UPDATE cache_state SET generation = generation + 1 WHERE id = 1"

      - name: Public smoke test (no credentials; includes anonymous write attempts that must be refused)
        if: ${{ inputs.mode == 'release' || inputs.mode == 'verify' }}
        env:
          # release mode asserts the live commit equals this run's commit; verify mode may run on a later main, so it does not
          SMOKE_EXPECT_COMMIT: ${{ inputs.mode == 'release' && github.sha || '' }}
        run: |
          node scripts/post_deploy_smoke.mjs | tee smoke.txt
          { echo '### Public smoke test'; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Real-browser check of both dashboards, read-only, no credentials (desktop and 375px mobile)
        if: ${{ inputs.mode == 'release' || inputs.mode == 'verify' }}
        run: |
          export E2E_BASE="$SMOKE_BASE"
          npm --prefix frontend ci
          npx --prefix frontend playwright install --with-deps chromium
          node test/e2e/production-readonly.e2e.mjs desktop | tee browser.txt
          node test/e2e/production-readonly.e2e.mjs mobile | tee -a browser.txt
          { echo '### Browser check (production, read-only)'; echo '```'; grep -E "PASS|FAIL|passed" browser.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify mode - live protected-record fingerprint (compare with the release run's 'before' values)
        if: ${{ inputs.mode == 'verify' }}
        run: |
          { echo '### Protected records now (verify mode)'; echo '```'; cat before.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "verify mode: live fingerprint printed above; compare applications, application_history, manual_overrides and candidates with the release run"

      - name: Fingerprint protected records after and compare
        if: ${{ inputs.mode == 'release' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/fingerprint.mjs --remote > after.json
          node -e "
            const b=require('./before.json'),a=require('./after.json');let bad=0;const lines=['| table | rows before | rows after | identical |','|---|---|---|---|'];
            for(const t of ['applications','application_history','manual_overrides','candidates']){const same=b[t].sha256===a[t].sha256;if(!same)bad++;lines.push('| '+t+' | '+b[t].rows+' | '+a[t].rows+' | '+(same?'yes':'**NO**')+' |');}
            for(const t of ['qualifications','scores']){lines.push('| '+t+' (informational: the collector may legitimately write) | '+b[t].rows+' | '+a[t].rows+' | '+(b[t].sha256===a[t].sha256?'yes':'changed')+' |');}
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### Protected records, field-level\n'+lines.join('\n')+'\n');
            console.log(lines.join('\n'));
            if(bad){console.error('Protected records changed during the release');process.exit(1);}"

      - name: How to roll back (only shown on failure)
        if: ${{ failure() }}
        run: |
          {
            echo "### The run did not complete"
            echo "If mode was preflight, nothing in production changed."
            echo "If mode was release: prefer a forward fix. To restore the previous Worker and frontend: \`npx wrangler rollback <previous version id from the preflight list>\` (run from the dashboard folder with the Cloudflare token)."
            echo "The previous Worker had no API authentication and no public/private split, so use the rollback only if the new Worker is unusable."
          } >> "$GITHUB_STEP_SUMMARY"
