name: Daily discovery (open ATS dataset + light job-site search)
# Once a day: selects matching postings for every candidate from an open dataset of about 5 million live ATS jobs, runs a
# handful of job-site searches, scores everything with the Worker's own screen and writes it to D1 (bounded per run).
# Ready / Stretch are filled only by the automatic shortlist rule (dataset_apply.mjs); human decisions and applications are never written. See dashboard/docs/DISCOVERY_PIPELINE.md.
on:
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Most new jobs written this run (0-3000)'
        default: '1500'
      job_sites:
        description: 'Also run the light job-site search (true/false)'
        default: 'true'
  schedule:
    - cron: '13 15,17,19,21 * * *'   # first trigger after the dataset refresh (about 14:30 UTC); the guard allows one real run per 20 hours, so a late or dropped trigger is caught up by the next
    - cron: '13 1,3 * * *'           # early next UTC day, when the day's read count has reset: catches a run the budget guard skipped all evening

permissions:
  contents: read
  actions: read   # the recent-run guard reads this workflow's earlier runs
  models: read   # the free AI review (engine/ai_triage.py) uses the workflow's own token

concurrency:
  # Its own group (plan R6): sharing d1-collector-sync with the watchlist and collector sync meant a discovery run queued by the watchdog could be
  # replaced by a newer queued run of another workflow (GitHub keeps one pending run per group). Its writes are guarded and idempotent.
  group: daily-discovery
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip == 'true' || steps.r.outputs.skip == 'true' }}
      budget_skip: ${{ steps.g.outputs.skip == 'true' && steps.r.outputs.skip != 'true' }}   # skipped for the budget although the run was due
    steps:
      - uses: actions/checkout@v4
      - name: Budget guard (account rows read today, from Cloudflare analytics; reads nothing from D1)
        id: g
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Plan H1 / phase 6 tenth man: the daily run itself read about 2.4M rows on 12 Nov, so it may start only while the day's total is under
          # 2.0M (5M free limit - 2.5M for the run - 0.5M for the evening's site traffic). A later start waits for the 01:13 / 03:13 UTC triggers.
          MAX_READS: '2000000'
          EVENT: ${{ github.event_name }}
        run: node dashboard/scripts/budget_guard.mjs
      - name: Recent-run guard (GitHub schedules start late or not at all, so this is triggered more often than needed and does the real work only when it is due)
        id: r
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: discovery.yml
          REAL_JOB: discover
          MIN_GAP_HOURS: '20'
          EVENT: ${{ github.event_name }}
        run: node dashboard/scripts/recent_run_guard.mjs

  # A due run that the budget guard skipped leaves one small row {skipped: "budget"} in the run log, so the page can tell a skipped day
  # ("Not updated today") from a quiet one. Writes one row; reads nothing from the database.
  skipped:
    needs: guard
    if: ${{ needs.guard.outputs.budget_skip == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the skipped run
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p ../work
          node scripts/run_log.mjs --skipped budget --kind discovery --event "${{ github.event_name }}" > ../work/runlog.sql
          npx wrangler d1 execute career-job-engine --remote --file=../work/runlog.sql > /dev/null

  discover:
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      healthy: ${{ steps.health.outputs.healthy }}
      reasons: ${{ steps.health.outputs.reasons }}
      audit: ${{ steps.audit.outcome }}
    # Cloudflare credentials are given only to the steps that use the database; the job-site step (third-party scraping
    # library) runs without them.
    steps:
      - name: Run start (the shortlist audit checks what this run wrote since then)
        id: start
        run: echo "at=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the job-site and feed steps run third-party code; no GitHub token is left in .git/config for them
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: D1 usage at the start (plan H1; Cloudflare analytics, reads nothing from D1; the run row stores what this run used)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mkdir -p work && node dashboard/scripts/usage_snapshot.mjs > work/usage_start.json
      - name: Validate inputs
        env:
          MAX_NEW: ${{ inputs.max_new || '1500' }}
        run: |
          case "$MAX_NEW" in ''|*[!0-9]*) echo "max_new must be a whole number"; exit 1;; esac
          [ "$MAX_NEW" -le 3000 ] || { echo "max_new must be at most 3000"; exit 1; }
          echo "MAX_NEW=$MAX_NEW" >> "$GITHUB_ENV"
      - name: Install (pinned)
        run: |
          pip install duckdb==2.0.0
          npm ci --prefix dashboard --ignore-scripts --no-audit --no-fund
      - name: Download today's dataset once (about 2.3 GB; queried locally)
        id: download
        continue-on-error: true   # a failed download no longer stops the day: the next step runs without the dataset
        run: |
          mkdir -p work
          curl -fsSL --retry 3 -A 'career-job-engine/1.0' -o work/all.parquet https://storage.stapply.ai/jobhive/v1/all.parquet
          ls -la work/all.parquet
      - name: Discovery state and past-applications tables (idempotent)
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute career-job-engine --remote --file=migrations/0014_discovery_state.sql > /dev/null
          npx wrangler d1 execute career-job-engine --remote --file=migrations/0016_past_applications.sql > /dev/null
      - name: Select matches from the dataset (and earlier rows to re-score)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOWNLOAD: ${{ steps.download.outcome }}
        run: |
          if [ "$DOWNLOAD" = "success" ] && [ -s work/all.parquet ]; then
            python engine/dataset_discovery.py --out work --dataset work/all.parquet --home-quota 400 --remote-quota 200 --rescore-export --rescore-per-candidate 800
          else
            echo "::warning::The dataset download failed: continuing with an empty dataset result (boards, other sources, re-score, still-open check and shortlist still run)"
            rm -f work/all.parquet
            python engine/dataset_discovery.py --out work --no-dataset --rescore-export --rescore-per-candidate 800
          fi
      - name: Light job-site search (no credentials; a blocked site is skipped)
        if: ${{ github.event_name == 'schedule' || inputs.job_sites != 'false' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python -m venv /tmp/jobsites && /tmp/jobsites/bin/pip install -q python-jobspy==1.4.1
          /tmp/jobsites/bin/python engine/jobsite_discovery.py --profiles work/profiles.json --out work --results 20 --hours 48
      - name: Remote job boards (official public feeds; no credentials)
        continue-on-error: true
        timeout-minutes: 5
        run: python engine/remote_boards.py --profiles work/profiles.json --out work --days 7 --budget-seconds 300
      - name: More sources (Workable, Eightfold, Siemens Energy, SuccessFactors employers, Arbeitnow, UN Careers, EURES; Adzuna when its free keys are set)
        continue-on-error: true
        timeout-minutes: 22
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # api.adzuna.com's robots.txt disallows every agent: Adzuna is read only when the owner sets this repository variable to true
          # (accepting that Adzuna's own API terms govern the keyed API). Settings > Secrets and variables > Actions > Variables.
          ADZUNA_API_TERMS_ACCEPTED: ${{ vars.ADZUNA_API_TERMS_ACCEPTED }}
        run: python engine/more_sources.py --profiles work/profiles.json --out work --days 30 --budget-seconds 1320
      - name: Remove job-site results already stored
        if: ${{ hashFiles('work/jobsite_raw.json') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python engine/dataset_discovery.py --dedupe work/jobsite_raw.json --out work
      - name: Employers listed publicly as hiring worldwide (no credentials; read at run time, never stored in the repo)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          git clone -q --depth 1 https://github.com/remoteintech/remote-jobs work/remoteintech || true
          curl -fsSL --retry 2 -o work/established-remote.md https://raw.githubusercontent.com/yanirs/established-remote/master/README.md || true
          curl -fsSL --retry 2 -o work/yc-hiring.json https://yc-oss.github.io/api/companies/hiring.json || true
          python engine/global_hirers.py --remoteintech work/remoteintech --established work/established-remote.md --yc work/yc-hiring.json --out work
      - name: Signals (UK sponsor register; taste model from the operator's decisions; no credentials)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          CSV=$(curl -fsSL --retry 2 -A 'career-job-engine/1.0' https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers | grep -oE 'https://assets\.publishing\.service\.gov\.uk/[^"]+\.csv' | head -1 || true)
          [ -n "$CSV" ] && curl -fsSL --retry 2 -A 'career-job-engine/1.0' -o work/uk_register.csv "$CSV" || echo "UK register link not found today"
          python engine/signals.py --uk-register work/uk_register.csv --taste-rows work/taste_rows.json --out work
      - name: Score with the Worker's own screen and write SQL
        working-directory: dashboard
        run: |
          IN="--in ../work/matches.json"
          [ -f ../work/jobsite_matches.json ] && IN="$IN --in ../work/jobsite_matches.json"
          [ -f ../work/global_hirers.json ] && IN="$IN --global-hirers ../work/global_hirers.json"
          [ -f ../work/signals.json ] && IN="$IN --signals ../work/signals.json"
          node --import ./test/register.mjs scripts/dataset_apply.mjs --candidates ../work/candidates.json $IN \
            --rescore ../work/rescore.json --taste-targets ../work/taste_targets.json --out ../work/apply.sql --shortlist-out ../work/shortlist.sql --max-new "$MAX_NEW"
          echo "UPDATE cache_state SET generation = generation + 1 WHERE id = 1;" >> ../work/apply.sql
          ls -la ../work/apply.sql
      - name: Write to D1 (one import; all or nothing)
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute career-job-engine --remote --file=../work/apply.sql > /dev/null
      - name: Free AI review of the best new jobs (currently OFF - GitHub Models was retired on 30 Jul 2026; set repository variable AI_REVIEW to on once another free provider is wired in)
        # The first production run (8 Nov) failed all 20 batches: the endpoint now answers HTTP 200 'OK' (text/plain) to every request,
        # and GitHub's docs say the inference API is no longer available to any customer. Off by default so the run does not make
        # pointless calls; the code and the probe workflow stay for the replacement provider.
        if: ${{ vars.AI_REVIEW == 'on' && hashFiles('work/apply.top.json') != '' }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python engine/ai_triage.py --in work/apply.top.json --out work/triage.sql --max 100 | tee work/triage_report.json
      - name: Write the AI review
        if: ${{ hashFiles('work/triage.sql') != '' }}
        continue-on-error: true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -s ../work/triage.sql ] && npx wrangler d1 execute career-job-engine --remote --file=../work/triage.sql > /dev/null || echo "no review to write"
      - name: Shortlist pool (plan A1; after today's import, before the still-open check, which verifies the pool first)
        id: pool
        continue-on-error: true   # no pool file: the shortlist selector does not run and the lists stay as they are
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python engine/dataset_discovery.py --out work --shortlist-pool work/shortlist_pool.json
      - name: Still open? List the shortlist pool first, then the best-ranked undecided jobs
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python engine/liveness.py --export work/liveness_targets.json --pool work/shortlist_pool.json
      - name: Still open? Check each posting (no credentials; only 404/410 twice closes a job)
        id: live_check
        if: ${{ hashFiles('work/liveness_targets.json') != '' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python engine/liveness.py --check work/liveness_targets.json --out work/liveness_result.json | tee work/liveness_report.json
          python engine/liveness.py --sql work/liveness_result.json --out work/liveness.sql
      - name: Still open? Close dead postings, mark live ones verified
        id: live_write
        if: ${{ hashFiles('work/liveness.sql') != '' }}
        continue-on-error: true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -s ../work/liveness.sql ] && npx wrangler d1 execute career-job-engine --remote --file=../work/liveness.sql > /dev/null || echo "nothing to write"
      - name: Shortlist (plan phase 3; chosen from the pool by scripts/shortlist_select.mjs, after the still-open check so today's verification counts)
        id: shortlist
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_WRITE: ${{ steps.live_write.outcome }}
        # When the still-open check verified 0 or too few rows today (it failed, ran out of time, sites refused, or its write failed), a row already on the
        # automatic shortlist keeps its place without a recent verification (--relaxed), so a fault of ours does not empty the lists; a new row still needs one.
        # The check's result counts only when its write succeeded (otherwise the database would not show the verification the selector relied on).
        run: |
          # "Too few" = fewer than max(10, a fifth of the targets): a day when most career sites refused our requests is our fault, not closures.
          RELAX=yes
          SEL="--pool ../work/shortlist_pool.json --candidates ../work/candidates.json --out ../work/shortlist_select.sql --report ../work/shortlist.report.json"
          if [ "$LIVE_WRITE" = "success" ] && [ -f ../work/liveness_report.json ]; then
            RELAX=$(python3 -c "import json,sys;r=json.load(open(sys.argv[1]));a=int(r.get('alive',0));t=int(r.get('targets',0));print('yes' if a < max(10, t // 5) else 'no')" ../work/liveness_report.json 2>/dev/null || echo yes)
            [ -f ../work/liveness_result.json ] && SEL="$SEL --liveness ../work/liveness_result.json"
          fi
          if [ "$RELAX" = "yes" ]; then SEL="$SEL --relaxed"; echo "The still-open check verified too few rows today: rows already shortlisted keep their place without a recent verification"; fi
          echo "relaxed=$RELAX" >> "$GITHUB_OUTPUT"
          if [ -s ../work/shortlist_pool.json ]; then
            node --import ./test/register.mjs scripts/shortlist_select.mjs $SEL
            if [ -s ../work/shortlist_select.sql ]; then npx wrangler d1 execute career-job-engine --remote --file=../work/shortlist_select.sql > /dev/null; else echo "no shortlist changes"; fi
          else
            echo "::warning::No shortlist pool today: Ready and Stretch stay as they are"
          fi
          # then low matches leave To review (a row demoted above that now scores low is held the same day)
          if [ -s ../work/shortlist.sql ]; then npx wrangler d1 execute career-job-engine --remote --file=../work/shortlist.sql > /dev/null; fi
      - name: Shortlist audit (plan A8; the hard rules on what is stored; a failure here turns the run red through the health job)
        id: audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SINCE: ${{ steps.start.outputs.at }}
          RELAXED: ${{ steps.shortlist.outputs.relaxed }}
        run: |
          node --import ./test/register.mjs scripts/shortlist_audit.mjs --print-sql --since "$SINCE" > ../work/audit.sql
          npx wrangler d1 execute career-job-engine --remote --json --command "$(cat ../work/audit.sql)" > ../work/audit_rows.json
          A="--rows ../work/audit_rows.json --candidates ../work/candidates.json --report ../work/shortlist.report.json --out ../work/shortlist_audit.json"
          [ "$RELAXED" = "no" ] || A="$A --relaxed"   # the still-open check verified too few rows today (or the shortlist step did not say): skip the 4-day check
          node --import ./test/register.mjs scripts/shortlist_audit.mjs $A
      - name: Record this run (one counts-only row in discovery_state; shown on the dashboard)
        if: always()
        continue-on-error: true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/usage_snapshot.mjs > ../work/usage_end.json || true
          node scripts/run_log.mjs --work ../work --kind discovery --event "${{ github.event_name }}" --status "${{ job.status }}" > ../work/runlog.sql
          echo "UPDATE cache_state SET generation = generation + 1 WHERE id = 1;" >> ../work/runlog.sql   # the page's "Updated" note sees this run at once
          npx wrangler d1 execute career-job-engine --remote --file=../work/runlog.sql > /dev/null
      - name: Run health (decided here; the health job below turns a "no" into a red run)
        id: health
        if: always()
        continue-on-error: true
        working-directory: dashboard
        run: node scripts/run_health.mjs --work ../work
      - name: Summary (counts only)
        if: always()
        run: |
          {
            echo '### Daily discovery'
            for f in work/report.json work/jobsite_report.json work/boards_report.json work/more_sources_report.json work/global_hirers.json work/apply.report.json work/triage_report.json work/liveness_report.json work/shortlist.report.json; do
              [ -f "$f" ] && { echo "**$f**"; echo '```'; python -c "import json,sys;d=json.load(open(sys.argv[1]));[d.pop(k,None) for k in ('log','keys','yc')];print(json.dumps(d,indent=1))" "$f"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Plan G1: one short message per person to a phone ("Sana: 4 new jobs today · ... · <link>"), also when the run failed ("today's update did
  # not finish"). Off until the owner adds the repository secret TELEGRAM_BOT_TOKEN (and links chats with telegram-link.yml) or sets the
  # variable DIGEST_PROVIDER=smtp with its secrets; without them this job only prints that it was skipped. Never fails the run.
  message:
    needs: [guard, discover]
    # Runs after a real run (finished, failed or stopped by its time limit) and on a due day the budget guard postponed, so a phone never gets
    # silence; the recent-run guard's own skips (the run already happened) send nothing.
    if: ${{ always() && (needs.guard.outputs.budget_skip == 'true' || (needs.guard.outputs.skip != 'true' && (needs.discover.result == 'success' || needs.discover.result == 'failure' || needs.discover.result == 'cancelled'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Is a channel set up?
        id: channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DIGEST_PROVIDER: ${{ vars.DIGEST_PROVIDER }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] || [ "$DIGEST_PROVIDER" = "smtp" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "Daily message: skipped - no channel is set up (repository secret TELEGRAM_BOT_TOKEN, or variable DIGEST_PROVIDER=smtp with its secrets). See dashboard/docs/RELEASE.md."; fi
      - uses: actions/setup-python@v5
        if: ${{ steps.channel.outputs.on == 'true' }}
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ steps.channel.outputs.on == 'true' }}
        with:
          node-version: '22'
      - name: Send the daily message (two small reads, one small write)
        if: ${{ steps.channel.outputs.on == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DIGEST_PROVIDER: ${{ vars.DIGEST_PROVIDER }}
          DIGEST_SMTP_HOST: ${{ vars.DIGEST_SMTP_HOST }}
          DIGEST_SMTP_PORT: ${{ vars.DIGEST_SMTP_PORT }}
          DIGEST_SMTP_USER: ${{ secrets.DIGEST_SMTP_USER }}
          DIGEST_SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
          # success only when the run finished AND its health check passed (a green run that did nothing says so); postponed when the budget guard skipped it
          STATUS: ${{ needs.guard.outputs.budget_skip == 'true' && 'postponed' || (needs.discover.result == 'success' && needs.discover.outputs.healthy == 'true') && 'success' || needs.discover.result == 'success' && 'unhealthy' || needs.discover.result }}
        run: |
          npm ci --prefix dashboard --ignore-scripts --no-audit --no-fund
          python engine/daily_message.py --send --status "$STATUS"

  # A run that went through but did nothing useful (still-open check verified 0 of its targets, every source failed, nothing written from a
  # fresh dataset, or a stale dataset), or whose shortlist audit (plan A8) found a broken hard rule, is shown red here. It is a separate job so the "discover" job stays successful: the recent-run guard and
  # the watchdog count it as the day's run and do not start the whole run again every two hours on a problem a re-run would not fix.
  health:
    needs: discover
    if: ${{ always() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Daily run health
        env:
          HEALTHY: ${{ needs.discover.outputs.healthy }}
          REASONS: ${{ needs.discover.outputs.reasons }}
          AUDIT: ${{ needs.discover.outputs.audit }}
        run: |
          if [ "$AUDIT" != "success" ]; then echo "::error title=Shortlist audit::the shortlist audit ${AUDIT:-did not run}: see its step in the discover job"; fi
          if [ "$HEALTHY" = "true" ] && [ "$AUDIT" = "success" ]; then echo "Run health: ok"; exit 0; fi
          [ "$HEALTHY" = "true" ] || echo "::error title=Daily run health::${REASONS:-the health check did not run}"
          exit 1
