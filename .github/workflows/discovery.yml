name: Daily discovery (open ATS dataset + light job-site search)
# Once a day: selects matching postings for every candidate from an open dataset of about 5 million live ATS jobs, runs a
# handful of job-site searches, scores everything with the Worker's own screen and writes it to D1 (bounded per run). Closes
# jobs that left the dataset. Nothing is ever marked READY; human decisions and applications are never written.
# Cost: a few minutes of Actions time per day. D1: bounded by --max-new (about 15k row writes per 1,000 jobs).
on:
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Most new jobs written this run'
        default: '1500'
      job_sites:
        description: 'Also run the light job-site search (true/false)'
        default: 'true'
  schedule:
    - cron: '13 15 * * *'   # 15:13 UTC, after the dataset's daily refresh (about 14:30 UTC)

permissions:
  contents: read

concurrency:
  group: d1-collector-sync   # never overlaps the collector sync's D1 writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (pinned)
        run: |
          pip install duckdb==2.0.0 python-jobspy==1.4.1
          npm ci --prefix dashboard --ignore-scripts --no-audit --no-fund
      - name: Select matches from the open ATS dataset (and earlier rows to re-score)
        run: python engine/dataset_discovery.py --out work --per-candidate 600 --rescore-export
      - name: Light job-site search (a few searches per candidate; a blocked site is skipped)
        if: ${{ github.event_name == 'schedule' || inputs.job_sites != 'false' }}
        continue-on-error: true
        run: python engine/jobsite_discovery.py --out work --results 20 --hours 48
      - name: Score with the Worker's own screen and write SQL
        working-directory: dashboard
        run: |
          IN="--in ../work/matches.json"
          [ -f ../work/jobsite_matches.json ] && IN="$IN --in ../work/jobsite_matches.json"
          node --import ./test/register.mjs scripts/dataset_apply.mjs --candidates ../work/candidates.json $IN \
            --rescore ../work/rescore.json --out ../work/apply.sql --max-new "${{ inputs.max_new || '1500' }}"
          echo "UPDATE cache_state SET generation = generation + 1 WHERE id = 1;" >> ../work/apply.sql
      - name: Write to D1
        working-directory: dashboard
        run: npx wrangler d1 execute career-job-engine --remote --file=../work/apply.sql > /dev/null
      - name: Summary (counts only)
        if: always()
        run: |
          {
            echo '### Daily discovery'
            for f in work/report.json work/jobsite_report.json work/apply.report.json; do
              [ -f "$f" ] && { echo "**$f**"; echo '```'; python -c "import json,sys;d=json.load(open(sys.argv[1]));d.pop('log',None);print(json.dumps(d,indent=1))" "$f"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"
