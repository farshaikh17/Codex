name: Daily discovery (open ATS dataset + light job-site search)
# Once a day: selects matching postings for every candidate from an open dataset of about 5 million live ATS jobs, runs a
# handful of job-site searches, scores everything with the Worker's own screen and writes it to D1 (bounded per run).
# Ready / Stretch are filled only by the automatic shortlist rule (dataset_apply.mjs); human decisions and applications are never written. See dashboard/docs/DISCOVERY_PIPELINE.md.
on:
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Most new jobs written this run (0-3000)'
        default: '1500'
      job_sites:
        description: 'Also run the light job-site search (true/false)'
        default: 'true'
  schedule:
    - cron: '13 15,17,19,21 * * *'   # first trigger after the dataset refresh (about 14:30 UTC); the guard allows one real run per 18 hours, so a late or dropped trigger is caught up by the next

permissions:
  contents: read
  actions: read   # the recent-run guard reads this workflow's earlier runs
  models: read   # the free AI review (engine/ai_triage.py) uses the workflow's own token

concurrency:
  group: d1-collector-sync   # never overlaps the collector sync's D1 writes
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip == 'true' || steps.r.outputs.skip == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Budget guard (account rows read today, from Cloudflare analytics; reads nothing from D1)
        id: g
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAX_READS: '2500000'
          EVENT: ${{ github.event_name }}
        run: node dashboard/scripts/budget_guard.mjs
      - name: Recent-run guard (GitHub schedules start late or not at all, so this is triggered more often than needed and does the real work only when it is due)
        id: r
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: discovery.yml
          REAL_JOB: discover
          MIN_GAP_HOURS: '18'
          EVENT: ${{ github.event_name }}
        run: node dashboard/scripts/recent_run_guard.mjs

  discover:
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Cloudflare credentials are given only to the steps that use the database; the job-site step (third-party scraping
    # library) runs without them.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the job-site and feed steps run third-party code; no GitHub token is left in .git/config for them
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inputs
        env:
          MAX_NEW: ${{ inputs.max_new || '1500' }}
        run: |
          case "$MAX_NEW" in ''|*[!0-9]*) echo "max_new must be a whole number"; exit 1;; esac
          [ "$MAX_NEW" -le 3000 ] || { echo "max_new must be at most 3000"; exit 1; }
          echo "MAX_NEW=$MAX_NEW" >> "$GITHUB_ENV"
      - name: Install (pinned)
        run: |
          pip install duckdb==2.0.0
          npm ci --prefix dashboard --ignore-scripts --no-audit --no-fund
      - name: Download today's dataset once (about 2.3 GB; queried locally)
        run: |
          mkdir -p work
          curl -fsSL --retry 3 -A 'career-job-engine/1.0' -o work/all.parquet https://storage.stapply.ai/jobhive/v1/all.parquet
          ls -la work/all.parquet
      - name: Discovery state and past-applications tables (idempotent)
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute career-job-engine --remote --file=migrations/0014_discovery_state.sql > /dev/null
          npx wrangler d1 execute career-job-engine --remote --file=migrations/0016_past_applications.sql > /dev/null
      - name: Select matches from the dataset (and earlier rows to re-score)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python engine/dataset_discovery.py --out work --dataset work/all.parquet --home-quota 400 --remote-quota 200 --rescore-export
      - name: Light job-site search (no credentials; a blocked site is skipped)
        if: ${{ github.event_name == 'schedule' || inputs.job_sites != 'false' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python -m venv /tmp/jobsites && /tmp/jobsites/bin/pip install -q python-jobspy==1.4.1
          /tmp/jobsites/bin/python engine/jobsite_discovery.py --profiles work/profiles.json --out work --results 20 --hours 48
      - name: Remote job boards (official public feeds; no credentials)
        continue-on-error: true
        timeout-minutes: 5
        run: python engine/remote_boards.py --profiles work/profiles.json --out work --days 7
      - name: More sources (Workable, Eightfold, Siemens Energy, SuccessFactors employers, Arbeitnow, Getro, UN Careers, EURES; Adzuna when its free keys are set)
        continue-on-error: true
        timeout-minutes: 22
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python engine/more_sources.py --profiles work/profiles.json --out work --days 30
      - name: Remove job-site results already stored
        if: ${{ hashFiles('work/jobsite_raw.json') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python engine/dataset_discovery.py --dedupe work/jobsite_raw.json --out work
      - name: Employers listed publicly as hiring worldwide (no credentials; read at run time, never stored in the repo)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          git clone -q --depth 1 https://github.com/remoteintech/remote-jobs work/remoteintech || true
          curl -fsSL --retry 2 -o work/established-remote.md https://raw.githubusercontent.com/yanirs/established-remote/master/README.md || true
          curl -fsSL --retry 2 -o work/yc-hiring.json https://yc-oss.github.io/api/companies/hiring.json || true
          python engine/global_hirers.py --remoteintech work/remoteintech --established work/established-remote.md --yc work/yc-hiring.json --out work
      - name: Signals (UK sponsor register; taste model from the operator's decisions; no credentials)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          CSV=$(curl -fsSL --retry 2 -A 'career-job-engine/1.0' https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers | grep -oE 'https://assets\.publishing\.service\.gov\.uk/[^"]+\.csv' | head -1 || true)
          [ -n "$CSV" ] && curl -fsSL --retry 2 -A 'career-job-engine/1.0' -o work/uk_register.csv "$CSV" || echo "UK register link not found today"
          python engine/signals.py --uk-register work/uk_register.csv --taste-rows work/taste_rows.json --out work
      - name: Score with the Worker's own screen and write SQL
        working-directory: dashboard
        run: |
          IN="--in ../work/matches.json"
          [ -f ../work/jobsite_matches.json ] && IN="$IN --in ../work/jobsite_matches.json"
          [ -f ../work/global_hirers.json ] && IN="$IN --global-hirers ../work/global_hirers.json"
          [ -f ../work/signals.json ] && IN="$IN --signals ../work/signals.json"
          node --import ./test/register.mjs scripts/dataset_apply.mjs --candidates ../work/candidates.json $IN \
            --rescore ../work/rescore.json --taste-targets ../work/taste_targets.json --out ../work/apply.sql --shortlist-out ../work/shortlist.sql --shortlist-unverified-out ../work/shortlist_unverified.sql --max-new "$MAX_NEW"
          echo "UPDATE cache_state SET generation = generation + 1 WHERE id = 1;" >> ../work/apply.sql
          ls -la ../work/apply.sql
      - name: Write to D1 (one import; all or nothing)
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute career-job-engine --remote --file=../work/apply.sql > /dev/null
      - name: Free AI review of the best new jobs (currently OFF - GitHub Models was retired on 30 Jul 2026; set repository variable AI_REVIEW to on once another free provider is wired in)
        # The first production run (8 Nov) failed all 20 batches: the endpoint now answers HTTP 200 'OK' (text/plain) to every request,
        # and GitHub's docs say the inference API is no longer available to any customer. Off by default so the run does not make
        # pointless calls; the code and the probe workflow stay for the replacement provider.
        if: ${{ vars.AI_REVIEW == 'on' && hashFiles('work/apply.top.json') != '' }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python engine/ai_triage.py --in work/apply.top.json --out work/triage.sql --max 100 | tee work/triage_report.json
      - name: Write the AI review
        if: ${{ hashFiles('work/triage.sql') != '' }}
        continue-on-error: true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -s ../work/triage.sql ] && npx wrangler d1 execute career-job-engine --remote --file=../work/triage.sql > /dev/null || echo "no review to write"
      - name: Still open? List the best-ranked undecided jobs
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python engine/liveness.py --export work/liveness_targets.json
      - name: Still open? Check each posting (no credentials; only 404/410 twice closes a job)
        id: live_check
        if: ${{ hashFiles('work/liveness_targets.json') != '' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python engine/liveness.py --check work/liveness_targets.json --out work/liveness_result.json | tee work/liveness_report.json
          python engine/liveness.py --sql work/liveness_result.json --out work/liveness.sql
      - name: Still open? Close dead postings, mark live ones verified
        id: live_write
        if: ${{ hashFiles('work/liveness.sql') != '' }}
        continue-on-error: true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -s ../work/liveness.sql ] && npx wrangler d1 execute career-job-engine --remote --file=../work/liveness.sql > /dev/null || echo "nothing to write"
      - name: Shortlist (Ready / Stretch by the stated rule; after the still-open check so today's verification counts)
        if: ${{ hashFiles('work/shortlist.sql') != '' }}
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_WRITE: ${{ steps.live_write.outcome }}
        # When the still-open check verified 0 rows today (it failed, ran out of time, or its write failed), the shortlist's demotion
        # skips its "verified in 4 days" condition, so a fault of ours does not empty the lists (promotion still needs a recent check).
        run: |
          VERIFIED=0
          if [ "$LIVE_WRITE" = "success" ] && [ -f ../work/liveness_report.json ]; then
            VERIFIED=$(python3 -c "import json,sys;print(int(json.load(open(sys.argv[1])).get('alive',0)))" ../work/liveness_report.json 2>/dev/null || echo 0)
          fi
          FILE=../work/shortlist.sql
          if [ "$VERIFIED" = "0" ]; then FILE=../work/shortlist_unverified.sql; echo "The still-open check verified 0 rows today: shortlist demotion skips the 4-day verification condition"; fi
          [ -s "$FILE" ] && npx wrangler d1 execute career-job-engine --remote --file="$FILE" > /dev/null || echo "nothing to write"
      - name: Record this run (one counts-only row in discovery_state; shown on the dashboard)
        if: always()
        continue-on-error: true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/run_log.mjs --work ../work --kind discovery --event "${{ github.event_name }}" > ../work/runlog.sql
          npx wrangler d1 execute career-job-engine --remote --file=../work/runlog.sql > /dev/null
      - name: Summary (counts only)
        if: always()
        run: |
          {
            echo '### Daily discovery'
            for f in work/report.json work/jobsite_report.json work/boards_report.json work/more_sources_report.json work/global_hirers.json work/apply.report.json work/triage_report.json work/liveness_report.json; do
              [ -f "$f" ] && { echo "**$f**"; echo '```'; python -c "import json,sys;d=json.load(open(sys.argv[1]));[d.pop(k,None) for k in ('log','keys','yc')];print(json.dumps(d,indent=1))" "$f"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"
