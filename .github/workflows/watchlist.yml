name: Watchlist (priority employers and boards, three times a day)
# Owner-approved 2026-11-07. Between the daily dataset runs, the employer sites that matter most (Siemens Energy, ENGIE, ACWA Power,
# Tata Power, Fluor, NEOM, TAQA, Workable) and the remote boards are read again, so a new posting is on the dashboard within hours.
# 14 Nov: also the watchlist employers' own boards (MonetizeMore, Massive Rocket, Sprinto, UptimeAI, Canvas Medical, Fingerprint, Paired,
# Firework), KBR and Wood in the Gulf, Schneider Electric, Cummins India, Apraava, Transguard, ReNew, JLL; every request passes robots.txt.
# Same scoring, same guards, same cap logic as the daily run; the dataset itself is not downloaded here.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *'   # every 2 hours at :07; the guard lets a real run happen only when none did in the last 7 hours (about 3 a day, caught up if GitHub drops a trigger)

permissions:
  contents: read
  actions: read   # the recent-run guard reads this workflow's earlier runs

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip == 'true' || steps.r.outputs.skip == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Budget guard (account rows read today, from Cloudflare analytics; reads nothing from D1)
        id: g
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAX_READS: '3500000'
          EVENT: ${{ github.event_name }}
        run: node dashboard/scripts/budget_guard.mjs
      - name: Recent-run guard (GitHub schedules start late or not at all, so this is triggered more often than needed and does the real work only when it is due)
        id: r
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: watchlist.yml
          REAL_JOB: watch
          MIN_GAP_HOURS: '7'
          EVENT: ${{ github.event_name }}
        run: node dashboard/scripts/recent_run_guard.mjs

  watch:
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    concurrency:   # only the job that writes to D1 shares this group with the collector sync (the discovery watchdog is its own workflow)
      group: d1-collector-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # the job-site and feed steps run third-party code; no GitHub token is left in .git/config for them
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: D1 usage at the start (plan H1; Cloudflare analytics, reads nothing from D1; the run row stores what this run used)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mkdir -p work && node dashboard/scripts/usage_snapshot.mjs > work/usage_start.json
      - name: Install (pinned)
        run: npm ci --prefix dashboard --ignore-scripts --no-audit --no-fund
      - name: Profiles and decisions from the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python engine/dataset_discovery.py --profiles-only --out work
      # Each writes its file after every source and starts no new source after 80% of its time budget (the step limit), so a slow day
      # keeps what it fetched; each exits non-zero when every one of its sources failed.
      - name: Priority employer sites (no credentials)
        continue-on-error: true
        timeout-minutes: 16
        run: python engine/more_sources.py --fast --profiles work/profiles.json --out work --days 7 --budget-seconds 960
      - name: Remote job boards (no credentials)
        continue-on-error: true
        timeout-minutes: 5
        run: python engine/remote_boards.py --profiles work/profiles.json --out work --days 2 --budget-seconds 300
      # Plan H1: a run that fetched nothing new reads and writes nothing more in the database. Before, every run wrote its SQL file, whose
      # housekeeping statements scan the whole jobs table, and bumped the cache generation, so every visitor's next list was recomputed.
      - name: Fetched any postings?
        id: fetched
        run: python3 -c "import json,sys;d=json.load(open('work/jobsite_raw.json'));print('count=%d' % len(d.get('jobs') or []))" >> "$GITHUB_OUTPUT" 2>/dev/null || echo "count=0" >> "$GITHUB_OUTPUT"
      - name: Remove results already stored
        if: ${{ steps.fetched.outputs.count != '0' && hashFiles('work/jobsite_raw.json') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python engine/dataset_discovery.py --dedupe work/jobsite_raw.json --out work
      # The same employer and sponsor signals as the daily run, so a job first seen here is scored the same way (it is never re-scored later).
      - name: Employers listed publicly as hiring worldwide (no credentials; read at run time, never stored in the repo)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          git clone -q --depth 1 https://github.com/remoteintech/remote-jobs work/remoteintech || true
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o work/established-remote.md https://raw.githubusercontent.com/yanirs/established-remote/master/README.md || true
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o work/yc-hiring.json https://yc-oss.github.io/api/companies/hiring.json || true
          python engine/global_hirers.py --remoteintech work/remoteintech --established work/established-remote.md --yc work/yc-hiring.json --out work
      - name: Signals (UK sponsor register; taste model from the operator's decisions; no credentials)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          CSV=$(curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --connect-timeout 30 -A 'career-job-engine/1.0' https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers | grep -oE 'https://assets\.publishing\.service\.gov\.uk/[^"]+\.csv' | head -1 || true)
          [ -n "$CSV" ] && curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --connect-timeout 30 -A 'career-job-engine/1.0' -o work/uk_register.csv "$CSV" || echo "UK register link not found today"
          python engine/signals.py --uk-register work/uk_register.csv --taste-rows work/taste_rows.json --out work
      - name: Anything new? (new postings, or a stored posting gaining a city)
        id: fresh
        run: |
          N=$(python3 -c "import json;d=json.load(open('work/jobsite_matches.json'));print(len(d.get('jobs') or []) + len(d.get('merge') or []))" 2>/dev/null || echo 0)
          echo "count=$N" >> "$GITHUB_OUTPUT"
          [ "$N" != "0" ] || echo "Nothing new in this run: no database write and the visitors' cached lists are kept"
      - name: Score and write SQL
        if: ${{ steps.fresh.outputs.count != '0' && hashFiles('work/jobsite_matches.json') != '' }}
        working-directory: dashboard
        run: |
          IN="--in ../work/jobsite_matches.json"
          [ -f ../work/global_hirers.json ] && IN="$IN --global-hirers ../work/global_hirers.json"
          [ -f ../work/signals.json ] && IN="$IN --signals ../work/signals.json"
          node --import ./test/register.mjs scripts/dataset_apply.mjs --candidates ../work/candidates.json $IN --out ../work/apply.sql --max-new 300 --no-shortlist
          echo "UPDATE cache_state SET generation = generation + 1 WHERE id = 1;" >> ../work/apply.sql
      - name: Write to D1
        if: ${{ hashFiles('work/apply.sql') != '' }}
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute career-job-engine --remote --file=../work/apply.sql > /dev/null
      - name: Record this run (one counts-only row in discovery_state; shown on the dashboard)
        if: always()
        continue-on-error: true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/usage_snapshot.mjs > ../work/usage_end.json || true
          node scripts/run_log.mjs --work ../work --kind watchlist --event "${{ github.event_name }}" --status "${{ job.status }}" > ../work/runlog.sql
          npx wrangler d1 execute career-job-engine --remote --file=../work/runlog.sql > /dev/null
      # A run that fetched nothing from any source must not count as done for 7 hours (the recent-run guard counts only a successful
      # "watch" job), so it fails here, after the run log is written, and the next trigger tries again.
      - name: Fetched something?
        run: |
          python3 - <<'PY'
          import json, os, sys
          read = 0
          for f in ('work/more_sources_report.json', 'work/boards_report.json'):
              if os.path.exists(f):
                  read += sum(int(r.get('read') or 0) for r in json.load(open(f)).values() if isinstance(r, dict))
          print(f'postings read from all sources: {read}')
          if read == 0:
              print('::error::The watchlist read nothing from any source (every source failed or ran out of time).')
              sys.exit(1)
          PY
      - name: Summary (counts only)
        if: always()
        run: |
          {
            echo '### Watchlist'
            for f in work/more_sources_report.json work/boards_report.json work/apply.report.json; do
              [ -f "$f" ] && { echo "**$f**"; echo '```'; python -c "import json,sys;d=json.load(open(sys.argv[1]));[d.pop(k,None) for k in ('log','keys','yc')];print(json.dumps(d,indent=1))" "$f"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"
