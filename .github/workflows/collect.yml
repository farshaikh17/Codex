name: Collect public job feeds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'sources.json', '.github/workflows/collect.yml']
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: public-job-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test incremental publishing and adapters
        run: python -m unittest -v
      - name: Validate source registry before any request
        run: python registry.py
      - name: Collect sources that are due (scheduled) or all enabled sources (manual, push)
        env:
          EVENT: ${{ github.event_name }}
        run: python collect.py --trigger "$EVENT"
      - name: Publish public data and failure status
        if: always()
        run: |
          if [ ! -f public/status.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public ATS snapshots'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
