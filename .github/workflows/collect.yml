name: Collect public job feeds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'sources.json', '.github/workflows/collect.yml']
  schedule:
    # Five daily collections: gaps of 5, 5, 5, 5 and 4 hours (UTC).
    - cron: '37 1,6,11,16,21 * * *'
permissions:
  contents: write
concurrency:
  group: public-job-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Start from the latest published snapshot
        # Runs are serialized (concurrency group above), but a run queued behind another one checked out the commit it was
        # triggered by, so it started from a snapshot the earlier run had already replaced and its own publication conflicted
        # (the "Update public ATS snapshots" rebase failures of 7 Nov). Fast-forward to the branch tip before collecting.
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only "origin/$GITHUB_REF_NAME" || git reset --hard "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test incremental publishing, adapters and the source registry
        # Collector and registry tests only. Engine tests run in engine.yml on demand, so they never add minutes to collections.
        run: python -m unittest -v test_collect test_registry
      - name: Validate source registry before any request
        run: python registry.py
      - name: Collect official employer feeds (every enabled source; one with its own poll_interval_hours waits until due)
        env:
          EVENT: ${{ github.event_name }}
        run: python collect.py --trigger "$EVENT"
      - name: Bounded public employer discovery and diverse vacancy evidence
        # Shares the five-daily invocation; each target/directory has a 24h cooldown.
        # Proposals never activate sources. Preserve ordinary feed publishing on discovery failure.
        continue-on-error: true
        run: python market_discovery.py
      - name: Build and verify shared posting records (no candidate data)
        run: |
          python -m unittest -v engine.tests.test_outputs
          python -m engine rebuild --db "$RUNNER_TEMP/postings.sqlite3"
          python -m engine ingest --db "$RUNNER_TEMP/postings.sqlite3"
          python -m engine extract --db "$RUNNER_TEMP/postings.sqlite3"
          python -m engine.outputs postings --db "$RUNNER_TEMP/postings.sqlite3" --out "$RUNNER_TEMP/posting-export" --limit 200
          python -m engine.outputs verify --out "$RUNNER_TEMP/posting-export"
          mkdir -p public/postings
          cp -a "$RUNNER_TEMP/posting-export/." public/postings/
      - name: Publish public data and failure status
        if: always()
        run: |
          if [ ! -f public/status.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain public/)" ] && ! python collect.py --verify; then
            git checkout -- public/ && git clean -fdq public/
            echo '::error::Publication was interrupted or inconsistent; public/ reverted to the last committed snapshot'
            exit 1
          fi
          git add public/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public ATS snapshots'
          # Someone merged to main while this run was collecting: replay the new snapshot on top (a data conflict is resolved in
          # favour of the snapshot this run just built and verified), and try again if the push races another one.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "::warning::rebase conflict on attempt $attempt"; sleep 5; continue
            fi
            if [ -n "$(git diff --name-only "origin/$GITHUB_REF_NAME" HEAD -- public/)" ] && ! python collect.py --verify; then
              echo '::error::the rebased snapshot did not verify'; exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 5
          done
          echo '::error::could not publish after 3 attempts'; exit 1
