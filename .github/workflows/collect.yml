name: Collect public job feeds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'sources.json', '.github/workflows/collect.yml']
  schedule:
    # Five daily collections: gaps of 5, 5, 5, 5 and 4 hours (UTC).
    - cron: '37 1,6,11,16,21 * * *'
permissions:
  contents: write
concurrency:
  group: public-job-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test incremental publishing, adapters and the source registry
        # Collector and registry tests only. Engine tests run in engine.yml on demand, so they never add minutes to collections.
        run: python -m unittest -v test_collect test_registry
      - name: Validate source registry before any request
        run: python registry.py
      - name: Collect official employer feeds (every enabled source; one with its own poll_interval_hours waits until due)
        env:
          EVENT: ${{ github.event_name }}
        run: python collect.py --trigger "$EVENT"
      - name: Build and verify shared posting records (no candidate data)
        run: |
          python -m unittest -v engine.tests.test_outputs
          python -m engine rebuild --db "$RUNNER_TEMP/postings.sqlite3"
          python -m engine ingest --db "$RUNNER_TEMP/postings.sqlite3"
          python -m engine extract --db "$RUNNER_TEMP/postings.sqlite3"
          python -m engine.outputs postings --db "$RUNNER_TEMP/postings.sqlite3" --out "$RUNNER_TEMP/posting-export" --limit 200
          python -m engine.outputs verify --out "$RUNNER_TEMP/posting-export"
          mkdir -p public/postings
          cp -a "$RUNNER_TEMP/posting-export/." public/postings/
      - name: Publish public data and failure status
        if: always()
        run: |
          if [ ! -f public/status.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain public/)" ] && ! python collect.py --verify; then
            git checkout -- public/ && git clean -fdq public/
            echo '::error::Publication was interrupted or inconsistent; public/ reverted to the last committed snapshot'
            exit 1
          fi
          git add public/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public ATS snapshots'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
