name: Capture allowlisted career pages (manual, bounded)
# No schedule on purpose: recurring browser crawling is not enabled.
# The push trigger only fires on the build branch so the live trial can run before merge
# (workflow_dispatch needs the file on the default branch). It is inert on main. crawl_pages.py is included so a
# change to the capture logic republishes the committed index instead of leaving counts the code no longer produces.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated page ids from pages.json (blank = least recently attempted first)'
        required: false
        default: ''
      batch_size:
        description: 'Pages this run (hard cap 10)'
        required: false
        default: '3'
  push:
    branches: [build/crawl4ai]
    paths: ['pages.json', 'crawl_pages.py', '.github/workflows/crawl-pages.yml']
permissions:
  contents: write
concurrency:
  group: career-page-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
          # Free Actions cache for downloaded wheels; installed versions still come from requirements-crawl.txt.
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: Test capture logic and feed collector (standard library only)
        run: python -m unittest -v
      - name: Install pinned Crawl4AI
        run: |
          python -m pip install --disable-pip-version-check -r requirements-crawl.txt
          echo "PLAYWRIGHT_VERSION=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright Chromium (system packages only if the browser cannot start)
        run: |
          python -m playwright install chromium
          # The runner image already has Chromium's libraries. apt installs of --with-deps took 10 minutes on a slow
          # mirror (run 40364258754), so they run only when a launch check fails.
          check='import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(); await b.close()
          asyncio.run(main())'
          if python -c "$check"; then
            echo "Chromium starts with the runner image libraries; skipping playwright install-deps"
          else
            echo "::warning::Chromium could not start; installing system packages with playwright install-deps"
            python -m playwright install-deps chromium
            python -c "$check"
          fi
      - name: Record installed versions and licenses
        run: |
          python - <<'PY'
          from importlib.metadata import distributions
          for d in sorted(distributions(),key=lambda d:d.metadata['Name'].lower()):
              m=d.metadata
              lic=m.get('License-Expression') or m.get('License') or ''
              lic=lic if lic and len(lic)<60 else next((c.split('::')[-1].strip() for c in m.get_all('Classifier') or [] if c.startswith('License ::')),lic[:60])
              print(m['Name'],d.version,lic,sep=' | ')
          PY
          python -m playwright --version
      - name: Capture one bounded batch
        env:
          IDS: ${{ inputs.ids }}
          BATCH: ${{ inputs.batch_size || '6' }}
        run: timeout 900 python crawl_pages.py --ids "$IDS" --batch-size "$BATCH"
      - name: Summarise capture and listing quality
        if: always()
        env:
          PIP_CACHE_HIT: ${{ steps.python.outputs.cache-hit }}
          BROWSER_CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          echo "Caches: pip ${PIP_CACHE_HIT:-false}, Playwright browsers ${BROWSER_CACHE_HIT:-false}." >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f public/pages/index.json ]; then exit 0; fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('public/pages/index.json'))
          print('## Career page capture %s (%s)\n'%(d.get('attempted_at'),d.get('schema')))
          print('Operations: %s. Browser requests: %s. Halted: %s.\n'%(d.get('operations'),d.get('browser_requests'),d.get('halted')))
          queue=[p['id'] for p in d['pages'] if p['id'] in d.get('batch',[]) and p.get('review_change') in ('new','changed')]
          quiet=[p['id'] for p in d['pages'] if p['id'] in d.get('batch',[]) and p.get('review_change') in ('unchanged','boilerplate_only','listings_unchanged')]
          print('Queue for review (review_change new/changed): %s. Not queued (unchanged/boilerplate_only/listings_unchanged): %s.\n'%(', '.join(queue) or 'none',', '.join(quiet) or 'none'))
          print('| page | result | listing quality | coverage | flags | job links | review basis | review change |')
          print('|---|---|---|---|---|---|---|---|')
          for p in d['pages']:
              if p['id'] in d.get('batch',[]):
                  a=p['last_attempt']
                  print('| %s | %s | %s | %s | %s | %s | %s | %s |'%(p['id'],a['result'],p.get('listing_quality'),p.get('coverage'),
                        ', '.join(p.get('flags') or []),p.get('job_links'),p.get('review_basis'),p.get('review_change')))
          PY
      - name: Publish captures and failure status
        if: always()
        run: |
          if [ ! -f public/pages/index.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/pages/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update career page captures'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
