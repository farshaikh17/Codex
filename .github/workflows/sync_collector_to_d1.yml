name: Sync Collector Postings to Cloudflare D1

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Target collector path, directory, or JSON file'
        required: false
        default: 'public/boards/drivetrain-lever.json'
        type: string
      limit:
        description: 'Maximum number of postings to import (bounded safety cap)'
        required: false
        default: '35'
        type: string
  push:
    branches: [main]   # a push to any other branch must never run its own code with the Cloudflare token against production data
    paths:
      - '.github/workflows/sync_collector_to_d1.yml'
      - 'engine/collector_importer.py'
      - 'engine/staging_bridge.py'
  schedule:
    # Runs at :45 UTC, shortly after the collect.yml :37 schedule
    - cron: '45 1,6,11,16,21 * * *'

permissions:
  contents: read

jobs:
  sync:
    name: Ingest Collector Snapshots into D1
    concurrency:   # only the job that writes to D1 shares this group with the watchlist
      group: d1-collector-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Budget guard (account rows read and written today; a scheduled run skips when the free allowance is nearly used)
        id: g
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAX_READS: '2500000'
          EVENT: ${{ github.event_name }}
        run: node dashboard/scripts/budget_guard.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js for Wrangler (Node 22 LTS required)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cloudflare Wrangler
        run: npm install -g wrangler@4.156.1

      - name: Ingest Collector Snapshots into Cloudflare D1
        if: ${{ steps.g.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Inputs go through the environment, never straight into the script text.
          SOURCE_INPUT: ${{ inputs.source }}
          LIMIT_INPUT: ${{ inputs.limit }}
        run: |
          SOURCE="${SOURCE_INPUT:-public}"
          LIMIT_FLAG=()
          if [ -n "$LIMIT_INPUT" ]; then
            case "$LIMIT_INPUT" in ''|*[!0-9]*) echo "::error::limit must be a whole number"; exit 1;; esac
            LIMIT_FLAG=(--limit "$LIMIT_INPUT")
          fi
          python engine/collector_importer.py --source "$SOURCE" --mode remote "${LIMIT_FLAG[@]}"
