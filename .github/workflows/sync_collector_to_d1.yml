name: Sync Collector Postings to Cloudflare D1

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Target collector path, directory, or JSON file'
        required: false
        default: 'public/boards/drivetrain-lever.json'
        type: string
      limit:
        description: 'Maximum number of postings to import (bounded safety cap)'
        required: false
        default: '35'
        type: string
  push:
    paths:
      - '.github/workflows/sync_collector_to_d1.yml'
      - 'engine/collector_importer.py'
      - 'engine/staging_bridge.py'
  schedule:
    # Runs at :45 UTC, shortly after the collect.yml :37 schedule
    - cron: '45 1,6,11,16,21 * * *'

permissions:
  contents: read

concurrency:
  group: d1-collector-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Ingest Collector Snapshots into D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js for Wrangler (Node 22 LTS required)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cloudflare Wrangler
        run: npm install -g wrangler@4.156.1

      - name: Ingest Collector Snapshots into Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SOURCE="${{ inputs.source || 'public' }}"
          LIMIT_FLAG=""
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ inputs.limit }}"
          fi
          python engine/collector_importer.py --source "$SOURCE" --mode remote $LIMIT_FLAG
