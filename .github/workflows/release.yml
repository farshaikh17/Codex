name: Release to production (manual)
# The ONLY path that changes production. Manual, from main, one run at a time, and it re-runs every check itself so
# it cannot bypass them. Nothing here is triggered by a push, a schedule or another workflow.
#
# TWO MODES (input `mode`):
#   preflight (default)  read-only. Proves the token, account, database and secrets are right and records the rollback
#                        points. Changes nothing in production. Run this first, every time.
#   release              preflight + fingerprint, migration 0008, optional key rotation, deploy, authenticated smoke
#                        test, real-browser check of both dashboards, fingerprint comparison.
#
# SECRETS are repository secrets (Settings > Secrets and variables > Actions), set once in the GitHub web UI, never in
# chat, files or issues. Repository secrets are readable by workflows on ANY branch of this repository; they are not
# restricted to this workflow or to main. Safeguards that do not need a paid plan: only this workflow references them,
# the repository has a single collaborator (the owner), the run refuses to start unless the actor is the repository
# owner, and the token is limited to one account and two permissions. If GitHub environments are available to your
# plan, move the secrets into an environment and add `environment:` to the `deploy` job (see docs/RELEASE.md).
#   CLOUDFLARE_API_TOKEN   token for the account that owns the career-job-engine Worker and D1 database
#                          (Account: Workers Scripts Edit, D1 Edit; nothing else)
#   CLOUDFLARE_ACCOUNT_ID  must equal account_id in wrangler.toml, or the run stops before touching anything
#   OPERATOR_SMOKE_KEY     REQUIRED. The current operator key (used for the authenticated smoke test and browser
#                          check). In preflight it is proven against the live Worker before anything changes.
#   NEW_ADMIN_API_KEY      REQUIRED only when rotate_key is ticked: the new key. The smoke test then uses this value.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight = read-only checks only (default). release = change production.'
        required: true
        type: choice
        options: [preflight, release]
        default: preflight
      confirm_sha:
        description: 'Full commit SHA of main you intend to release (must equal the commit this run uses)'
        required: true
        type: string
      rotate_key:
        description: 'Replace ADMIN_API_KEY with the NEW_ADMIN_API_KEY secret (leave off to keep the current key)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
# Explicit bash so every step runs with -e -o pipefail: a failed `wrangler deploy | tee` fails the step.
defaults:
  run:
    shell: bash
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard - owner, main only, exact commit
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          CONFIRM: ${{ inputs.confirm_sha }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::Only the repository owner may run releases"; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Releases run from main only (this run is on $REF)"; exit 1; }
          [ "$CONFIRM" = "$SHA" ] || { echo "::error::confirm_sha does not match the commit being released ($SHA)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MODE: ${{ inputs.mode }}
      ROTATE: ${{ inputs.rotate_key }}
      SMOKE_BASE: https://career-job-engine.farshaikh17.workers.dev
    steps:
      - name: Guard - owner, main only, exact commit (again, in the job that holds the secrets)
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          CONFIRM: ${{ inputs.confirm_sha }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ "$ACTOR" = "$OWNER" ] && [ "$REF" = "refs/heads/main" ] && [ "$CONFIRM" = "$SHA" ] || { echo "::error::Not the owner, not main, or confirm_sha mismatch"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: Preflight - account, database, token permissions, secrets, rollback points (read-only)
        env:
          OPERATOR_SMOKE_KEY: ${{ secrets.OPERATOR_SMOKE_KEY }}
          NEW_ADMIN_API_KEY: ${{ secrets.NEW_ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          echo "### Release $MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets"; exit 1; }
          EXPECTED=$(grep -E '^account_id' wrangler.toml | sed -E 's/.*"([0-9a-f]+)".*/\1/')
          [ "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not the account in wrangler.toml; stopping before any change"; exit 1; }
          echo "- account matches wrangler.toml: yes" >> "$GITHUB_STEP_SUMMARY"
          # The key that the smoke test and browser check will use. It must exist before anything changes.
          if [ "$ROTATE" = "true" ]; then
            [ -n "$NEW_ADMIN_API_KEY" ] || { echo "::error::rotate_key is ticked but the NEW_ADMIN_API_KEY secret is empty"; exit 1; }
            echo "- verification key: NEW_ADMIN_API_KEY (rotation requested)" >> "$GITHUB_STEP_SUMMARY"
          else
            [ -n "$OPERATOR_SMOKE_KEY" ] || { echo "::error::OPERATOR_SMOKE_KEY secret is required: authenticated checks are not optional"; exit 1; }
            echo "- verification key: OPERATOR_SMOKE_KEY" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Database identity: the database the token sees must be the one wrangler.toml names.
          DB_ID=$(grep -E '^database_id' wrangler.toml | sed -E 's/.*"([0-9a-f-]+)".*/\1/')
          npx wrangler d1 info career-job-engine > d1info.txt
          grep -q "$DB_ID" d1info.txt || { echo "::error::The D1 database named career-job-engine in this account is not the one in wrangler.toml"; exit 1; }
          echo "- D1 database id matches wrangler.toml: yes" >> "$GITHUB_STEP_SUMMARY"
          # Secret exists (name only, the value is never read).
          if npx wrangler secret list --format json | node -e "const s=JSON.parse(require('fs').readFileSync(0,'utf8'));process.exit(s.some(x=>x.name==='ADMIN_API_KEY')?0:1)"; then
            echo "- ADMIN_API_KEY present in Cloudflare (value never read): yes" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ROTATE" = "true" ]; then
            echo "- ADMIN_API_KEY present in Cloudflare: no (rotation will create it)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::ADMIN_API_KEY is not set in Cloudflare. Re-run with rotate_key after adding the NEW_ADMIN_API_KEY secret."; exit 1
          fi
          # Unlock path: when keeping the key, prove OPERATOR_SMOKE_KEY is the live key before any change.
          if [ "$ROTATE" != "true" ]; then
            CODE=$(node -e "
              fetch(process.env.SMOKE_BASE+'/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:process.env.OPERATOR_SMOKE_KEY})}).then(r=>console.log(r.status)).catch(()=>console.log('error'))")
            [ "$CODE" = "200" ] || { echo "::error::OPERATOR_SMOKE_KEY was not accepted by the live Worker (HTTP $CODE). Fix the secret before releasing."; exit 1; }
            echo "- OPERATOR_SMOKE_KEY accepted by the live Worker: yes" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Rollback information, recorded in the summary (these also prove the token's permissions).
          { echo '- current deployments (rollback target = newest entry before this release):'; echo '```'; npx wrangler deployments list | tail -n 12; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo '- D1 restore bookmark (Time Travel):'; echo '```'; npx wrangler d1 time-travel info career-job-engine; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fingerprint protected records before
        run: node scripts/fingerprint.mjs --remote > before.json && cat before.json

      - name: Preflight finished - nothing was changed
        if: ${{ inputs.mode == 'preflight' }}
        run: echo "Preflight passed: token permissions, account, database, secrets and rollback records are all in order. Run again with mode=release to deploy." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add the guess-limiter table (additive, idempotent; migrations 0001-0007 are NOT replayed)
        if: ${{ inputs.mode == 'release' }}
        run: npx wrangler d1 execute career-job-engine --remote --file=migrations/0008_auth_failures.sql

      - name: Rotate operator key (only when requested)
        if: ${{ inputs.mode == 'release' && inputs.rotate_key }}
        env:
          NEW_ADMIN_API_KEY: ${{ secrets.NEW_ADMIN_API_KEY }}
        run: printf '%s' "$NEW_ADMIN_API_KEY" | npx wrangler secret put ADMIN_API_KEY

      - name: Build and deploy
        if: ${{ inputs.mode == 'release' }}
        run: |
          npm run build:frontend
          npx wrangler deploy 2>&1 | tee deploy.log
          VERSION=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | awk '{print $4}' || true)
          echo "- deployed version: \`${VERSION:-see log}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (authenticated checks are required, not optional)
        if: ${{ inputs.mode == 'release' }}
        env:
          OPERATOR_SMOKE_KEY: ${{ secrets.OPERATOR_SMOKE_KEY }}
          NEW_ADMIN_API_KEY: ${{ secrets.NEW_ADMIN_API_KEY }}
          REQUIRE_AUTH_SMOKE: '1'
        run: |
          if [ "$ROTATE" = "true" ]; then export SMOKE_KEY="$NEW_ADMIN_API_KEY"; else export SMOKE_KEY="$OPERATOR_SMOKE_KEY"; fi
          node scripts/post_deploy_smoke.mjs | tee -a smoke.txt
          cat smoke.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Real-browser check of both dashboards, read-only (desktop and 375px mobile)
        if: ${{ inputs.mode == 'release' }}
        env:
          OPERATOR_SMOKE_KEY: ${{ secrets.OPERATOR_SMOKE_KEY }}
          NEW_ADMIN_API_KEY: ${{ secrets.NEW_ADMIN_API_KEY }}
        run: |
          if [ "$ROTATE" = "true" ]; then export E2E_KEY="$NEW_ADMIN_API_KEY"; else export E2E_KEY="$OPERATOR_SMOKE_KEY"; fi
          export E2E_BASE="$SMOKE_BASE"
          npm --prefix frontend ci
          npx --prefix frontend playwright install --with-deps chromium
          # One unlock per viewport; the limiter is not exercised here.
          node test/e2e/production-readonly.e2e.mjs desktop | tee -a browser.txt
          node test/e2e/production-readonly.e2e.mjs mobile | tee -a browser.txt
          { echo '### Browser check (production, read-only)'; echo '```'; grep -E "PASS|FAIL|passed" browser.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fingerprint protected records after and compare
        if: ${{ inputs.mode == 'release' }}
        run: |
          node scripts/fingerprint.mjs --remote > after.json
          node -e "
            const b=require('./before.json'),a=require('./after.json');let bad=0;const lines=['| table | rows before | rows after | identical |','|---|---|---|---|'];
            for(const t of ['applications','application_history','manual_overrides','candidates']){const same=b[t].sha256===a[t].sha256;if(!same)bad++;lines.push('| '+t+' | '+b[t].rows+' | '+a[t].rows+' | '+(same?'yes':'**NO**')+' |');}
            for(const t of ['qualifications','scores']){lines.push('| '+t+' (informational: the collector may legitimately write) | '+b[t].rows+' | '+a[t].rows+' | '+(b[t].sha256===a[t].sha256?'yes':'changed')+' |');}
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### Protected records, field-level\n'+lines.join('\n')+'\n');
            console.log(lines.join('\n'));
            if(bad){console.error('Protected records changed during the release');process.exit(1);}"

      - name: How to roll back (only shown on failure)
        if: ${{ failure() }}
        run: |
          {
            echo "### The run did not complete"
            echo "If mode was preflight, nothing in production changed."
            echo "If mode was release: prefer a forward fix. To restore the previous Worker and frontend: \`npx wrangler rollback <previous version id from the preflight list>\`."
            echo "The previous Worker has no API authentication, so only use it if the new one is unusable."
          } >> "$GITHUB_STEP_SUMMARY"
