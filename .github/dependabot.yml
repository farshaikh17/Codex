# Weekly dependency and GitHub Action update PRs, a few at a time. Nothing merges by itself: the normal tests (tests.yml, dashboard-verify.yml) run on each PR
# and a release to production is still the separate manual workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /dashboard/frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
